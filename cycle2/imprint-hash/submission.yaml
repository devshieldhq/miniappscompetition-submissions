builder_story: "A few weeks ago I joined the Nimiq Telegram for the first time,
  and I noticed someone struggling to find NIM they had unstaked. They kept
  asking, \"Where is my NIM?\"\r

  \r

  So I did a little research. I found out you can't stake from Nimiq Pay at all:
  you have to go to the Nimiq Wallet website. And getting staked NIM back is
  confusing: it takes three separate steps, a wait of up to a day, and one step
  that can't be undone. It's easy to lose track of where your NIM is.\r

  \r

  So I built NimJar, a mini app that lets you stake your NIM in one tap, right
  inside Nimiq Pay, and get it back whenever you want. It shows you exactly
  where your NIM is at every moment (available, staked, or on its way back),
  counts down the wait, and walks you through each step, so nobody has to ask
  \"where is my NIM?\" again."
