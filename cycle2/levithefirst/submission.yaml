builder_story: "Preventah started with something personal. My maternal
  grandmother had dementia, and now my mom is showing signs of it. Seeing that
  happen made me realize I don't want to simply wait and find out whether the
  same thing happens to me.\r

  \r

  I wanted a practical way to take action instead of just knowing that a health
  risk runs in my family. So I built Preventah to turn that awareness into a
  daily prevention routine with a personalized plan, check-ins, optional
  measurements, reminders, and a USDT commitment to keep showing up.\r

  \r

  The goal is to help me actively work towards a healthier future instead of
  waiting until it is too late."
