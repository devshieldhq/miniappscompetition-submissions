builder_story: "Savanna Run was inspired by a desire to see more African
  stories, characters and environments represented in gaming.\r

  \r

  Growing up, we were surrounded by incredible cultures, landscapes, music and
  stories. However, when we look at many of the games we play, these experiences
  aren’t always reflected. So, we wanted to create something that feels familiar
  to us but is still exciting to anyone around the world.\r

  \r

  This idea evolved into Savanna Run, an endless runner where players follow
  Kesi through markets, the savanna, riversides and ancient ruins, collecting
  the Ember Baton and discovering a world inspired by Africa.\r

  \r

  We’re not aiming to create a game that feels like a history lesson, Instead,
  we want to capture the beauty and imagination of Africa and transform it into
  something playful, adventurous and memorable.\r

  \r

  At its core, Savanna Run is our way of demonstrating that African stories can
  serve as the foundation for games that people from all over the world can
  enjoy.\r

  \r

  Private dashboard: https://oputasamuel.github.io/Savanna-Run-Admin-Site/\r

  \r

  \r

  Web: www.savanna-run.xyz"
