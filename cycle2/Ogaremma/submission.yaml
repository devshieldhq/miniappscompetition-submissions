builder_story: "I built Veyronis to address a common problem in digital
  transactions: buyers and sellers may agree on terms, but resolving a dispute
  can become difficult when evidence, payment, and trust are separated across
  different systems.\r

  \r

  Veyronis combines self-custodial escrow with evidence-backed dispute
  resolution. A buyer creates an agreement, funds are secured in escrow, and an
  arbitrator can resolve a dispute using submitted evidence. Attestcoin is the
  current evidence-verification provider, while the verification layer is
  designed to support additional providers in future.\r

  \r

  For the Nimiq Mini Apps Competition, I adapted Veyronis to Nimiq Pay so NIM
  becomes part of the escrow-creation experience. Inside Nimiq Pay, users
  authorize their Nimiq wallet and complete an explicit 0.01 NIM service-fee
  transaction before continuing with agreement creation.\r

  \r

  The project is open-source and built to combine Nimiq's payment experience
  with an existing cross-chain escrow product."
