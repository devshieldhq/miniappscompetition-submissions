builder_story: "A friend of mine once sent NIM to the wrong address. He copied
  it from a chat, missed one character, and it was gone - not stolen, just gone
  to nobody. There’s no undo on a chain and no one to call. That’s why Nimtag
  exists.\r

  \r

  Nobody should have to type, copy, or squint at a 36-character address to pay
  someone they know.\r

  \r

  With Nimtag, you claim a name once. Your wallet signs a short message proving
  the address is yours, free, with no transaction , and the name is yours
  permanently.\r

  \r

  From then on, anyone using Nimiq Pay can type your name, see your identicon to
  confirm it’s you, and send NIM. Every payment carries `@you → @them` in the
  memo, making transfers readable on-chain by name.\r

  \r

  Names are permanent: one per wallet, never changed, sold, or transferred.\r

  \r

  Building Nimtag also taught me something about Nimiq Pay itself: mini apps
  receive an address, while Nimiq Pay automatically moves incoming NIM into
  internal accounts. Nimtag follows that flow, so the balance and transaction
  history you see are real, not just an empty front door.\r

  \r

  Nimiq Pay is the wallet. Nimtag is who you send to.\r

  \r

  It’s live and open source under MIT. Nimtag holds nothing but names — no keys,
  no funds, no accounts.\r

  \r

  Three people claimed names on day one, and that made me realize that i can
  solve part of the major onchain problems"
